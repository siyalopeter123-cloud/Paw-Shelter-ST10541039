<section>
<h2>Send Us An Enquiry</h2>
<p>Want to adopt a pet or ask a question? Fill in the form below.</p>
<form>

<input type="text" placeholder="Enter your full name" required>

<select><option>Dogs</option><option>Cats</option><option>Other</option></select>
<label>Your Message</label>
<textarea rows="5" placeholder="Type your enquiry here..." required></textarea>
<button type="submit">Send Enquiry</button>
</form>
</section>
